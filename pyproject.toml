[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-event-monitor"
version = "0.1.0"
description = "Deterministic Spark Event Log parser and local web dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
compression = ["lz4>=4.3", "zstandard>=0.22", "python-snappy>=0.7"]

[project.scripts]
spark-monitor = "spark_monitor.cli:main"

[tool.setuptools.package-data]
spark_monitor = ["static/*"]

